<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="560" rx="10" fill="#ffffff"/>
  <!-- column headers -->
  <g font-size="15" font-weight="700" fill="#1b2230" text-anchor="middle">
    <text x="260" y="44">A. Weights</text>
    <text x="465" y="44">B. Decoding</text>
    <text x="670" y="44">C. External observer</text>
    <text x="875" y="44">D. Exposure</text>
